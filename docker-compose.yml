services:
  sorter:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-source-file-sorter:local
    init: true
    environment:
      RUST_LOG: ${SORTER_LOG_LEVEL:-warn}
      SORTER_CONFIG: /config/sorter.toml
      SORTER_DATABASE: /data/sorter.db
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./config:/config
      - ./data:/data
      - ${SORTER_FILES_ROOT:-./sandbox}:/files

