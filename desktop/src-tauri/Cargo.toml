[package]
name = "sorter-desktop"
version.workspace = true
description = "Desktop interface for Open Source File Sorter"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sorter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde.workspace = true
sorter-core = { path = "../../crates/sorter-core" }
sorter-runtime = { path = "../../crates/sorter-runtime" }
sorter-storage = { path = "../../crates/sorter-storage" }

[dev-dependencies]
sorter-fs = { path = "../../crates/sorter-fs" }
tempfile.workspace = true

[lints]
workspace = true
