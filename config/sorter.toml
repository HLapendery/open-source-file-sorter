version = 1

[settings]
collision_policy = "skip"
watch_debounce_ms = 500
stabilization_delay_ms = 2000
reconciliation_interval_seconds = 300
event_queue_capacity = 1024
max_concurrent_operations = 2
temporary_file_globs = ["*.crdownload", "*.download", "*.part", "*.partial", "*.tmp", "~$*"]

[[rules]]
id = "documents"
enabled = true
priority = 10
destination = "/files/sorted/documents"

[rules.match]
extensions = ["pdf", "docx", "odt"]
case_sensitive = false

[[rules]]
id = "invoices"
enabled = true
priority = 100
destination = "/files/sorted/invoices"

[rules.match]
filename_regex = ".*invoice.*\\.pdf$"
case_sensitive = false

[[directories]]
id = "downloads"
path = "/files/incoming"
enabled = true
mode = "watch"
recursive = false
rules = ["documents", "invoices"]
