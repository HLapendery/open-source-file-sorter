version = 1

[settings]
# Existing files are never overwritten. Other values: "rename-with-suffix", "error".
collision_policy = "skip"
# Watch events are coalesced before a file is inspected.
watch_debounce_ms = 500
# A file must keep the same size and modification time for this long.
stabilization_delay_ms = 2000
# Native notifications are reconciled periodically because events can be lost.
reconciliation_interval_seconds = 300
event_queue_capacity = 1024
max_concurrent_operations = 2
temporary_file_globs = ["*.crdownload", "*.download", "*.part", "*.partial", "*.tmp", "~$*"]

[[rules]]
id = "documents"
enabled = true
priority = 10
destination = "/files/sorted/documents"

[rules.match]
extensions = ["pdf", "docx", "odt"]

[[rules]]
id = "invoices"
enabled = true
priority = 100
destination = "/files/sorted/invoices"

[rules.match]
# Matching is case-insensitive by default.
filename_regex = ".*invoice.*\\.pdf$"

[[rules]]
id = "text-reports"
enabled = true
priority = 20
destination = "/files/sorted/reports"

[rules.match]
# Values inside a group are ORed. Groups are combined with this operator.
operator = "all"
filename_globs = ["report-*", "summary-*"]
extensions = ["txt", "md"]

[[directories]]
id = "downloads"
path = "/files/incoming"
enabled = true
mode = "watch"
recursive = false
rules = ["documents", "invoices", "text-reports"]

# Scheduled mode uses six-field cron expressions including seconds:
# mode = "scheduled"
# schedule = "0 0 2 * * *"
# schedule_timezone = "local" # or "utc"
